# OpenTAKServer Web UI (HTTP) - serves the Vue.js frontend and proxies
# API/Marti/socket.io requests to the OTS Flask app on 127.0.0.1:8081.
# Mirrors the official OTS nginx layout (ots_http) but without TLS, for
# local Docker dev. Put TLS termination in front (reverse proxy) for prod.
#
# IMPORTANT: use $http_host (not $host) so the port is preserved. When
# engineio's cors_allowed_origins is None (the default), it builds the
# allowed origin from the Host header. $host strips the port, producing
# "http://127.0.0.1" which never matches the browser's Origin header
# ("http://127.0.0.1:8080") - every socket.io POST is rejected with 400
# "Not an accepted origin." $http_host keeps the port so they match.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /var/www/html/opentakserver;
    index index.html index.htm;

    client_max_body_size 100M;

    # Marti API
    location /Marti {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OTS REST API
    location /api {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # socket.io - long-polling transport. We strip the Upgrade and
    # Connection headers so the backend never sees a websocket upgrade
    # request; engineio returns a harmless 400 "Invalid transport" and
    # the browser falls back to polling, which is fully functional.
    # (gevent-websocket does not work through nginx's ws proxy.)
    location /socket.io {
        proxy_pass http://127.0.0.1:8081/socket.io;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
    }

    # SPA fallback - serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Web UI (HTTPS) - Optional, exposed on 8443
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate /data/ots/ca/certs/opentakserver/opentakserver.pem;
    # OTS also creates an encrypted .key file. Nginx starts non-interactively,
    # so it must use the generated key without a passphrase.
    ssl_certificate_key /data/ots/ca/certs/opentakserver/opentakserver.nopass.key;

    root /var/www/html/opentakserver;
    index index.html index.htm;

    client_max_body_size 100M;

    # Marti API
    location /Marti {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OTS REST API
    location /api {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # socket.io
    location /socket.io {
        proxy_pass http://127.0.0.1:8081/socket.io;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Certificate Enrollment (HTTPS)
server {
    listen 8446 ssl;
    listen [::]:8446 ssl;
    server_name _;

    ssl_certificate /data/ots/ca/certs/opentakserver/opentakserver.pem;
    ssl_certificate_key /data/ots/ca/certs/opentakserver/opentakserver.nopass.key;

    client_max_body_size 100M;

    # Pass all enrollment requests to the API
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
